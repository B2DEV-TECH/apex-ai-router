# Non-secret routing policy (spec section 8). Safe to commit: targets only
# reference credentials by environment variable name, never inline values.
#
# apex-auto uses the `llm_classifier` strategy: the gateway forwards the
# request to a switchyard-server sidecar (see deploy/switchyard/), which
# performs the actual efficient/capable classification against the
# `efficient_target`/`capable_target`/`judge_target`/`threshold` below
# (rendered into that sidecar's routes.toml by
# `apex_ai_router.routing.switchyard_config.render_routes_toml`).

routes:
  apex-auto:
    strategy: llm_classifier
    switchyard_target: switchyard
    efficient_target: efficient
    capable_target: capable
    judge_target: judge
    threshold: 0.5

  apex-efficient:
    strategy: fixed
    target: efficient

  apex-capable:
    strategy: fixed
    target: capable

targets:
  efficient:
    provider: openai_compatible
    model: ${EFFICIENT_MODEL_ID}
    base_url: ${EFFICIENT_MODEL_BASE_URL}
    api_key_env: EFFICIENT_MODEL_API_KEY

  capable:
    provider: openai_compatible
    model: ${CAPABLE_MODEL_ID}
    base_url: ${CAPABLE_MODEL_BASE_URL}
    api_key_env: CAPABLE_MODEL_API_KEY

  judge:
    provider: openai_compatible
    model: ${JUDGE_MODEL_ID}
    base_url: ${JUDGE_MODEL_BASE_URL}
    api_key_env: JUDGE_MODEL_API_KEY

  switchyard:
    provider: switchyard
    model: apex-auto
    base_url: ${SWITCHYARD_BASE_URL}
