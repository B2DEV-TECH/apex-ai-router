  expected_characteristics:
    - valid JSON
    - correct keys and values
  scoring_method: valid_json
  scoring_params:
    required_keys: ["customer_name", "order_id", "total_amount"]
  judge_eligible: false

- id: json-002
  category: json_extraction
  difficulty: easy
  prompt: |
    Extract the ORA error code and the short description from this line
    as a JSON object with keys "error_code" and "description":
    "ORA-00001: unique constraint (APP.T_ORDERS_PK) violated"
  expected_characteristics:
    - valid JSON
    - error_code equals "ORA-00001"
  scoring_method: valid_json
  scoring_params:
    required_keys: ["error_code", "description"]
  judge_eligible: false

- id: json-003
  category: json_extraction
  difficulty: medium
  prompt: |
    Extract every invoice id and amount pair from this text into a JSON
    array of objects, each with keys "invoice_id" and "amount":
