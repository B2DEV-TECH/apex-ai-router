# APEX AI Router benchmark task dataset (spec sections 26-27, 51).
#
# All content below is synthetic -- no proprietary or customer data. Every
# SQL/PL-SQL task references the same small synthetic schema so tasks stay
# self-consistent:
#
#   T_CUSTOMERS(CUSTOMER_ID, CUSTOMER_NAME, EMAIL, STATUS)
#   T_ORDERS(ORDER_ID, CUSTOMER_ID, ORDER_DATE, STATUS, TOTAL_AMOUNT)
#   T_INVOICES(INVOICE_ID, ORDER_ID, DUE_DATE, PAID_YN, AMOUNT)
#
# Field reference:
#   id                     unique, stable across benchmark runs
#   category               one of the 14 categories in spec section 26
#   difficulty             easy | medium | hard (spec section 51)
#   prompt                 sent verbatim as the single user message
#   expected_characteristics  human-readable notes -- documentation and
#                          judge context, not machine-parsed
#   scoring_method         key into benchmark/scoring.py's registry
#   scoring_params         arguments for that scoring method
#   judge_eligible         whether an optional LLM judge pass (spec
#                          section 27) may also score this task; false for
#                          tasks with an objective, fully-deterministic
#                          answer where a judge adds no signal

- id: sum-001
  category: simple_summarization
  difficulty: easy
  prompt: |
    Summarize the following note in exactly one sentence:
    "Customer Jane Doe called to report that order ORD-1042 arrived with
    two damaged units out of five. She has requested a partial refund of
    $40 and does not want a replacement shipment."
  expected_characteristics:
    - one sentence
    - preserves the refund amount and the reason
  scoring_method: keyword_presence
  scoring_params:
    required_keywords: ["refund", "40", "damaged"]
    case_sensitive: false
  judge_eligible: true

- id: sum-002
  category: simple_summarization
  difficulty: easy
  prompt: |
    Summarize the following note in exactly one sentence:
    "The nightly ETL job that loads T_ORDERS failed at 02:14 due to a
    unique constraint violation on ORDER_ID 88831, which already existed
    from a retried batch. No customer-facing impact; the job was rerun
    successfully at 03:00."
  expected_characteristics:
    - one sentence
    - mentions the cause (duplicate/constraint) and the outcome (resolved)
  scoring_method: keyword_presence
  scoring_params:
    required_keywords: ["88831", "rerun"]
    case_sensitive: false
  judge_eligible: true

- id: email-001
  category: business_email_generation
  difficulty: easy
  prompt: |
    Write a short business email to customer Jane Doe informing her that
    her $40 refund for order ORD-1042 has been approved and will post to
    her original payment method within 5-7 business days. Sign it from
    "Accounts Support".
  expected_characteristics:
    - greeting naming Jane Doe
    - states the amount and order number
    - professional closing
  scoring_method: keyword_presence
  scoring_params:
    required_keywords: ["Jane", "ORD-1042", "40", "Accounts Support"]
    case_sensitive: false
  judge_eligible: true

- id: email-002
  category: business_email_generation
  difficulty: medium
  prompt: |
    Write a business email to a supplier informing them that invoice
    INV-2207 for $1,250.00 is 12 days overdue, referencing purchase order
    PO-5541, and requesting payment confirmation or an updated payment
    date within 5 business days.
  expected_characteristics:
    - references INV-2207, PO-5541, amount, and the 5-business-day ask
  scoring_method: keyword_presence
  scoring_params:
    required_keywords: ["INV-2207", "PO-5541", "1,250", "overdue"]
    case_sensitive: false
  judge_eligible: true

- id: json-001
