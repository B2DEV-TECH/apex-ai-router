name: gateway-ci

on:
  push:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-ci.yml"
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Unit + contract tests
        run: uv run pytest tests/unit tests/contract

      - name: Integration tests (mock providers only, no live credentials)
        run: uv run pytest tests/integration

      - name: Dependency vulnerability scan
        # Informational (spec section 39: "where practical") -- reports known
        # CVEs in resolved dependencies without blocking the pipeline on a
        # third-party advisory the project cannot immediately act on.
        continue-on-error: true
        run: uvx pip-audit --local
